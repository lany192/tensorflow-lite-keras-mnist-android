[versions]
agp = "9.4.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.11.0"
constraintlayout = "2.2.1"
tensorflow = "2.17.0"
# 与 core-ktx 传递进来的 lifecycle 版本对齐，避免同一组库出现两个版本
lifecycleRuntimeKtx = "2.6.2"
# core-ktx 的 api variant 已带入 coroutines-core 1.8.1，而 lifecycle-common 把 coroutines-android
# 钉在 1.6.4。这里显式对齐两者：偏斜在下层是 NoSuchMethodError 的常见来源。
coroutines = "1.8.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
tensorflow = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflow" }
# 只需要 runtime-ktx（lifecycleScope / repeatOnLifecycle）。
# viewModels() 扩展已并入 androidx.activity:activity，StateFlow / Channel 由 coroutines-core 提供，
# 所以 lifecycle-viewmodel-ktx 是多余的。
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

